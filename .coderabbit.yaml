# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  in_progress_fortune: false
  poem: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
  path_instructions:
    - path: "src/**/*.py"
      instructions: |
        Review as an independent senior Python engineer. Prioritize functional correctness,
        edge cases, exception handling, typing, async/concurrency behavior, API misuse,
        security, data integrity, idempotency, observability, testability, and unnecessary
        complexity. Flag Python-specific issues that a non-Python project owner may miss.
        Prefer concrete blocking findings over style-only suggestions.
    - path: "tests/**/*.py"
      instructions: |
        Check that tests cover important success, failure, boundary, and malformed-input paths.
        Flag tests that only mirror implementation details or would pass despite broken behavior.
    - path: "**/*.md"
      instructions: |
        Review governance and architecture changes for contradictions, stale assumptions,
        missing operational consequences, and accidental weakening of review or safety gates.
